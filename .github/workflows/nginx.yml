name: nginx

# Builds nginx for FloServer and publishes it as a GitHub Release
# (tag nginx-<version>-<build>). The Publisher's Updates window picks the
# release up from here (D36.3).
on:
  workflow_dispatch:
    inputs:
      version: {description: "nginx version (in sources.json)", required: true, default: "1.30.6"}
      openssl: {description: "OpenSSL version (in sources.json)", required: true, default: "3.5.9"}
      pcre2: {description: "PCRE2 version (in sources.json)", required: true, default: "10.49"}
      zlib: {description: "zlib version (in sources.json)", required: true, default: "1.3.2"}
      build: {description: "Build number (raise it to rebuild the same version)", required: true, default: "1"}
      platforms:
        description: Platforms
        type: choice
        options: [linux-x64, macos-arm64, both]
        default: linux-x64
      publish: {description: "Publish a release (off: build and test only)", type: boolean, default: true}
  pull_request:
    paths: ["scripts/build-nginx.sh", "scripts/smoke-nginx.sh", "scripts/package.sh", "scripts/fetch.py", ".github/workflows/nginx.yml"]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(.github/scripts/matrix.sh '${{ inputs.platforms || 'linux-x64' }}')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      V: ${{ inputs.version || '1.30.6' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/build-nginx.sh "$V" "${{ inputs.openssl || '3.5.9' }}" "${{ inputs.pcre2 || '10.49' }}" "${{ inputs.zlib || '1.3.2' }}" "${{ matrix.platform }}" dist
      - name: Smoke test
        run: scripts/smoke-nginx.sh "dist/nginx-$V"
      - name: Package
        run: scripts/package.sh "dist/nginx-$V" "${{ matrix.platform }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nginx-${{ inputs.version }}-${{ inputs.build }}
        run: |
          {
            echo "nginx ${{ inputs.version }} for FloServer, build ${{ inputs.build }}."
            echo
            echo "Built with OpenSSL ${{ inputs.openssl }}, PCRE2 ${{ inputs.pcre2 }} and zlib ${{ inputs.zlib }} (static) by workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} from commit ${{ github.sha }}."
            echo
            echo '```'
            cat out/*.sha256
            echo '```'
          } > notes.md
          gh release create "$TAG" out/* --title "nginx ${{ inputs.version }} (build ${{ inputs.build }})" --notes-file notes.md --target "${{ github.sha }}"
